name: Python Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install numpy scipy matplotlib opencv-python-headless
        pip install keras tensorflow  # или tensorflow-cpu для экономии времени

    - name: Run tests with pytest
      run: |
        python test_perception4e.py --coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Run performance tests
      run: |
        python test_perception4e.py --performance
      continue-on-error: true  # Позволяет сбору продолжаться даже если тесты производительности упадут

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install linter
      run: |
        pip install pylint

    - name: Analysing the code with pylint
      run: |
        pylint --exit-zero perception4e.py test_perception4e.py